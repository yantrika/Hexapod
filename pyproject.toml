[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
exclude = ["^\\.venv/"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not timing and not audio'"
markers = [
    "timing: wall-clock bound tests, sensitive to machine load (run with: pytest -m timing)",
    "audio: need the real Piper binary and voice (run with: pytest -m audio)",
]
