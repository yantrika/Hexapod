<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>hexa control</title>
<style>
  :root {
    --bg: #101418; --panel: #1b222a; --panel-hold: #2f6fed; --text: #e8edf2; --muted: #8b98a5;
    --ok: #2fbf71; --warn: #e0a030; --bad: #e5484d; --stop: #d11a2a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 16px/1.3 system-ui, sans-serif; overscroll-behavior: none;
  }
  /* Controls: no scroll, no text selection, no long-press menu, no double-tap zoom. */
  .pad, .pad * , #stop {
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; flex-direction: column; height: 100%; padding: 12px 16px;
         padding-bottom: max(12px, env(safe-area-inset-bottom)); gap: 10px; }
  #status { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: var(--bad); flex: none; }
  #dot.on { background: var(--ok); }
  #state { font-size: 20px; font-weight: 700; }
  #last { color: var(--muted); font-size: 14px; margin-left: auto; text-align: right; }
  #login { display: flex; flex-direction: column; gap: 12px; margin: auto 0; }
  #login input, #login button, #reconnect {
    font: inherit; font-size: 22px; padding: 14px; border-radius: 12px; border: 0;
  }
  #login input { background: var(--panel); color: var(--text); text-align: center; letter-spacing: .3em; }
  #login button, #reconnect { background: var(--panel-hold); color: #fff; font-weight: 700; }
  #msg { color: var(--warn); min-height: 1.3em; text-align: center; }
  #control { display: none; flex: 1; flex-direction: column; gap: 10px; min-height: 0; }
  .app-on #login { display: none; }
  .app-on #control { display: flex; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
         gap: 10px; flex: 1; min-height: 0; }
  .pad button {
    background: var(--panel); color: var(--text); border: 0; border-radius: 16px;
    font-size: 17px; font-weight: 600; padding: 0;
  }
  .pad button.held { background: var(--panel-hold); color: #fff; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; font: inherit; font-weight: 600; padding: 14px 0; border-radius: 12px;
                border: 0; background: var(--panel); color: var(--text); }
  .row button:active { background: var(--panel-hold); }
  #speedrow { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
  #speed { flex: 1; }
  #stop { background: var(--stop); color: #fff; border: 0; border-radius: 16px;
          font-size: 34px; font-weight: 800; letter-spacing: .08em; height: 96px; flex: none; }
  #stop:active { background: #8f1220; }
  #reconnect { display: none; }
  .lost #reconnect { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="status">
    <div id="dot"></div>
    <div id="state">not connected</div>
    <div id="last"></div>
  </div>

  <form id="login" autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
    <button type="submit">Connect</button>
  </form>
  <div id="msg"></div>
  <button id="reconnect" type="button">Reconnect</button>

  <div id="control">
    <div class="pad" id="pad">
      <button data-btn="tl" type="button">&#8630; Turn L</button>
      <button data-btn="fwd" type="button">&#9650; Forward</button>
      <button data-btn="tr" type="button">Turn R &#8631;</button>
      <button data-btn="left" type="button">&#9664; Strafe L</button>
      <button data-btn="back" type="button">&#9660; Back</button>
      <button data-btn="right" type="button">Strafe R &#9654;</button>
    </div>
    <div id="speedrow"><span>speed</span>
      <input id="speed" type="range" min="0.1" max="1" step="0.1" value="0.5" aria-label="speed">
      <span id="speedval">0.5</span></div>
    <div class="row">
      <button data-cmd="stand" type="button">Stand</button>
      <button data-cmd="sit" type="button">Sit</button>
      <button data-cmd="wave" type="button">Wave</button>
    </div>
    <button id="stop" type="button">STOP</button>
  </div>
</div>

<script>
"use strict";
// One combined walk message per change and a repeat at send_hz while any move button is held.
// The server (not this page) enforces the deadman; the stops sent here are a second line.
var AXES = {
  fwd: {forward: 1}, back: {forward: -1}, left: {strafe: 1}, right: {strafe: -1},
  tl: {yaw: 1}, tr: {yaw: -1}
};
var ws = null, opened = false, sendHz = 10, repeat = null;
var held = new Map();            // pointerId -> button name
var $ = function (id) { return document.getElementById(id); };

function store(key, value) {
  try { if (value === undefined) { return sessionStorage.getItem(key); } sessionStorage.setItem(key, value); }
  catch (e) { return null; }
}
function setState(text, on) { $("state").textContent = text; $("dot").className = on ? "on" : ""; }
function say(text) { $("msg").textContent = text || ""; }
function send(obj) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; } return false; }

function axes() {
  var names = new Set(held.values()), sum = {forward: 0, strafe: 0, yaw: 0};
  names.forEach(function (name) {
    var axis = AXES[name];
    for (var key in axis) { sum[key] += axis[key]; }
  });
  return sum;
}
function walkMessage() {
  var a = axes();
  return {action: "walk", forward: a.forward, strafe: a.strafe, yaw: a.yaw,
          speed: parseFloat($("speed").value)};
}
function anyMove() { var a = axes(); return a.forward !== 0 || a.strafe !== 0 || a.yaw !== 0; }

function paint() {
  var names = new Set(held.values());
  document.querySelectorAll("[data-btn]").forEach(function (b) {
    b.classList.toggle("held", names.has(b.dataset.btn));
  });
}
function update() {                 // the held set changed
  paint();
  send(walkMessage());              // all-zero = release: the robot ramps down to a halt
  if (anyMove() && repeat === null) {
    repeat = setInterval(function () { send(walkMessage()); }, 1000 / sendHz);
  } else if (!anyMove() && repeat !== null) {
    clearInterval(repeat); repeat = null;
  }
}
function stopAll() {                // hard stop: forget every touch, then `stop`
  held.clear();
  if (repeat !== null) { clearInterval(repeat); repeat = null; }
  paint();
  send({action: "stop"});
}

document.querySelectorAll("[data-btn]").forEach(function (button) {
  button.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    try { button.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    held.set(e.pointerId, button.dataset.btn);
    update();
  });
  button.addEventListener("pointerup", function (e) {
    e.preventDefault();
    if (held.delete(e.pointerId)) { update(); }
  });
  button.addEventListener("pointercancel", function (e) {
    held.delete(e.pointerId);
    stopAll();
  });
  button.addEventListener("lostpointercapture", function (e) {
    if (held.delete(e.pointerId)) { update(); }
  });
});
document.querySelectorAll("[data-cmd]").forEach(function (button) {
  button.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    held.clear(); if (repeat !== null) { clearInterval(repeat); repeat = null; } paint();
    send({action: button.dataset.cmd});
  });
});
$("stop").addEventListener("pointerdown", function (e) { e.preventDefault(); stopAll(); });
$("speed").addEventListener("input", function () {
  $("speedval").textContent = $("speed").value;
  if (anyMove()) { send(walkMessage()); }
});

// No long-press menu, no text selection, no scroll or zoom gestures on the controls.
["contextmenu", "selectstart", "dragstart", "gesturestart"].forEach(function (name) {
  document.addEventListener(name, function (e) { e.preventDefault(); });
});
document.addEventListener("touchmove", function (e) {
  if (!(e.target && e.target.id === "speed")) { e.preventDefault(); }
}, {passive: false});

// Leaving the page for any reason stops the robot.
document.addEventListener("visibilitychange", function () { if (document.hidden) { stopAll(); } });
window.addEventListener("blur", stopAll);
window.addEventListener("pagehide", stopAll);

function connect(pin) {
  say(""); setState("connecting...", false); opened = false;
  document.getElementById("app").classList.remove("lost");
  var scheme = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(scheme + "//" + location.host + "/ws?pin=" + encodeURIComponent(pin));
  ws.onopen = function () { opened = true; store("pin", pin); };
  ws.onmessage = function (event) {
    var m; try { m = JSON.parse(event.data); } catch (e) { return; }
    if (m.type === "hello") {
      sendHz = m.send_hz || sendHz;
      document.getElementById("app").classList.add("app-on");
      setState(m.state, true);
    } else if (m.type === "status") {
      setState(m.state, true);
      $("last").textContent = m.status + (m.detail && m.detail.reason ? ": " + m.detail.reason : "");
    } else if (m.type === "deadman") {
      held.clear(); paint();
      if (repeat !== null) { clearInterval(repeat); repeat = null; }
      $("last").textContent = "stopped: signal lost";
    } else if (m.type === "error") {
      $("last").textContent = "refused: " + m.reason;
    }
  };
  ws.onclose = function () {
    held.clear(); paint();
    if (repeat !== null) { clearInterval(repeat); repeat = null; }
    setState("disconnected", false);
    document.getElementById("app").classList.remove("app-on");
    document.getElementById("app").classList.add("lost");
    say(opened ? "Connection lost. The robot was told to stop."
               : "Refused: wrong PIN, too many tries (wait a minute), or another phone is in control.");
  };
}

$("login").addEventListener("submit", function (e) {
  e.preventDefault();
  var pin = $("pin").value.trim();
  if (pin) { connect(pin); }
});
$("reconnect").addEventListener("click", function () {
  var pin = store("pin") || $("pin").value.trim();
  if (pin) { connect(pin); } else { say("Enter the PIN."); }
});
var fromHash = /(?:^#|&)pin=([^&]*)/.exec(location.hash);
if (fromHash) {                      // http://host:port/#pin=123456 connects at once
  history.replaceState(null, "", location.pathname);
  connect(decodeURIComponent(fromHash[1]));
}
</script>
</body>
</html>
